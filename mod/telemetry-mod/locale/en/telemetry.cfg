[mod-setting-name]
telemetry-log-file=Telemetry log file name
telemetry-afk-interval-seconds=AFK poll interval (seconds)
telemetry-debug=Enable telemetry debug logging
telemetry-debug-afk=Enable AFK debug logging
telemetry-afk-info-enabled=AFK info messages in chat
telemetry-afk-info-threshold-seconds=AFK threshold for info (seconds)
telemetry-max-bytes=Max telemetry file size (bytes)
telemetry-max-age-seconds=Max telemetry log age (seconds)
telemetry-evolution-enabled=Evolution telemetry enabled
telemetry-evolution-interval-seconds=Evolution poll interval (seconds)
telemetry-evolution-min-delta=Evolution min delta to log
telemetry-evolution-include-dominance=Include dominance thresholds
telemetry-evolution-notify-chat=Notify players in chat on thresholds
telemetry-evolution-surface-names=Observed surfaces (comma/space-separated)
telemetry-evolution-force-name=Observed force name

[mod-setting-description]
telemetry-log-file=Filename inside script-output where telemetry JSON Lines are written.
telemetry-afk-interval-seconds=How often the mod checks player AFK state.
telemetry-debug=Emit debug messages to chat/log for telemetry processing.
telemetry-debug-afk=Emit additional debug messages for AFK tracking.
telemetry-afk-info-enabled=Show AFK/return messages in chat.
telemetry-afk-info-threshold-seconds=Seconds of inactivity to mark a player as AFK.
telemetry-max-bytes=Maximum size of the telemetry log file before trimming.
telemetry-max-age-seconds=Maximum age of telemetry entries before trimming.
telemetry-evolution-enabled=If disabled, the mod will not poll evolution or emit evolution events.
telemetry-evolution-interval-seconds=How often the mod polls the force evolution factor.
telemetry-evolution-min-delta=Minimum change in evolution factor that triggers a telemetry "poll" line.
telemetry-evolution-include-dominance=Also emit events for dominance change thresholds (approximate).
telemetry-evolution-notify-chat=Show built-in messages in chat when thresholds are crossed.
telemetry-evolution-surface-names=Comma/space-separated surface names to monitor for evolution (e.g., nauvis, vulcanus).
telemetry-evolution-force-name=Which force to observe (usually "enemy").

[telemetry-mod]
prefix=[telemetry-mod]
debug-wrote-line=Wrote telemetry line.
debug-wrote-line-with=Wrote telemetry line: __1__.
debug-write-line-failed=Failed to write telemetry line: __1__.
debug-wrote-buffer=Wrote telemetry buffer (__1__ lines).
debug-wrote-buffer-bytes=Wrote telemetry buffer, bytes=__1__.
debug-write-buffer-failed=Failed to write telemetry buffer: __1__.
init-cleared=Telemetry mod initialized; telemetry log cleared.
init-no-backend=Telemetry mod initialized (write_file may be unavailable on this runtime).
init-write-failed=Telemetry mod init: write_file failed: __1__.
config-changed=Telemetry mod configuration changed; settings re-applied.
settings-updated=Telemetry mod settings updated.
evolution-poll-skipped=Evolution poll: accumulated delta below threshold — skipping log.
evolution-chat=__1__ (EF=__2__%).
evolution-chat-no-pct=__1__.
evolution-chat-surface=__1__ (EF=__2__%) on __3__.
evolution-chat-surface-no-pct=__1__ on __2__.
afk-on=__1__ is AFK (__2__s).
afk-off=__1__ returned from AFK.

