[mod-setting-name]
telemetry-evolution-enabled=Evolution telemetry enabled
telemetry-evolution-interval-seconds=Evolution poll interval (seconds)
telemetry-evolution-min-delta=Evolution min delta to log
telemetry-evolution-include-dominance=Include dominance thresholds
telemetry-evolution-notify-chat=Notify players in chat on thresholds
telemetry-evolution-force-name=Observed force name

[mod-setting-description]
telemetry-evolution-enabled=If disabled, the mod will not poll evolution or emit evolution events.
telemetry-evolution-interval-seconds=How often the mod polls the force evolution factor.
telemetry-evolution-min-delta=Minimum change in evolution factor that triggers a telemetry "poll" line.
telemetry-evolution-include-dominance=Also emit events for dominance change thresholds (approximate).
telemetry-evolution-notify-chat=Show built-in messages in chat when thresholds are crossed.
telemetry-evolution-force-name=Which force to observe (usually "enemy").
