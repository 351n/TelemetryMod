[mod-setting-description]
telemetry-log-file=Nazwa pliku w script-output, do ktorego zapisywane sa linie JSON.
telemetry-afk-interval-seconds=Jak czesto mod sprawdza status AFK graczy.
telemetry-debug=Dodaje komunikaty debug do czatu/logu dla telemetrii.
telemetry-debug-afk=Dodaje dodatkowe komunikaty debug dla sledzenia AFK.
telemetry-afk-info-enabled=Pokazuje komunikaty AFK/powrotu na czacie.
telemetry-afk-info-threshold-seconds=Liczba sekund bezczynnosci do uznania gracza za AFK.
telemetry-max-bytes=Maksymalny rozmiar pliku telemetrii przed przycieciem.
telemetry-max-age-seconds=Maksymalny wiek wpisow telemetrii przed przycieciem.
telemetry-evolution-enabled=Gdy wylaczone, mod nie sprawdza ewolucji ani nie emituje zdarzen ewolucji.
telemetry-evolution-interval-seconds=Jak czesto mod odczytuje evolution_factor.
telemetry-evolution-min-delta=Minimalna zmiana evolution_factor, po ktorej zostanie zapisany wpis typu "poll".
telemetry-evolution-include-dominance=Emituje tez zdarzenia dla progow "zmiany dominanty" (przyblizone).
telemetry-evolution-notify-chat=Pokazuje wbudowane komunikaty na czacie przy przekroczeniu progow.
telemetry-evolution-surface-names=Lista nazw powierzchni do monitorowania (np. nauvis, vulcanus).
telemetry-evolution-force-name=Ktora frakcje obserwowac (zwykle "enemy").
telemetry-speaker-notify-enabled=Po wlaczeniu speaker moze emitowac telemetry, gdy jego warunek alertu przejdzie na aktywny.
telemetry-speaker-notify-interval-seconds=Jak czesto mod skanuje Programmable Speaker pod katem aktywnych alertow.
telemetry-speaker-notify-cooldown-seconds=Minimalny odstep czasu miedzy wiadomosciami telemetry z tego samego speakera.
telemetry-speaker-notify-max-events-per-poll=Maksymalna liczba wiadomosci telemetrycznych ze speakerow wysylanych w jednym skanie.

